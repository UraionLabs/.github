name: Feature request
description: Propose a change or new capability in a Uraion Labs repository.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the change you want. Organization-wide contribution defaults are in [CONTRIBUTING.md](https://github.com/UraionLabs/.github/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change, at a technical level? APIs, flags, and behavior matter more than slogans.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing tools, or why this belongs in this repository.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, prior art, or constraints maintainers should know.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I read the repository README (and CONTRIBUTING.md, if present).
          required: true
