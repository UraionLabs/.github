name: Bug report
description: Report incorrect or unexpected behavior in a Uraion Labs repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects in a public Uraion Labs repository.

        If this is a **security vulnerability**, do not continue. Report it privately using [SECURITY.md](https://github.com/UraionLabs/.github/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or a small example.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, repository version or commit, runtime versions, and anything else needed to reproduce.
      placeholder: |
        OS:
        Commit / version:
        Runtime / toolchain:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Relevant logs, stack traces, or screenshots. Redact secrets.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report is not a security vulnerability (those go through SECURITY.md).
          required: true
